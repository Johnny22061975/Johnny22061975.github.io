var pad = function(n){ return String(n).padStart(2,'0'); };
var ymd = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var parse = function(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };

var addDays = function(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };

function addMonths(s,n){

  var easter=ymd(new Date(y,month-1,day)), map={};

  map[addDays(easter,-2)]='Karfreitag';
  map[addDays(easter,1)]='Ostermontag';
  map[y+'-05-01']='Tag der Arbeit';
  map[addDays(easter,39)]='Christi Himmelfahrt';

/* ---------- Speicher: geteilte Datenbank oder lokal ---------- */
function localStore(){
  var colls={}, subs={};
  function load(c){ try{ return JSON.parse(localStorage.getItem('fp2_c_'+c)||'{}'); }catch(e){ return {}; } }
  function save(c){ try{ localStorage.setItem('fp2_c_'+c,JSON.stringify(colls[c])); }catch(e){} }
  function ensure(c){ if(!colls[c]) colls[c]=load(c); }
  function rows(c){ ensure(c); return Object.keys(colls[c]).map(function(id){ return Object.assign({id:id},colls[c][id]); }); }
  function notify(c,changes){ (subs[c]||[]).forEach(function(cb){ cb(rows(c),changes); }); }
  return {
    mode:'local',
    watch:function(c,cb){
      (subs[c]=subs[c]||[]).push(cb);
      setTimeout(function(){ cb(rows(c),[]); },0);
      return function(){ subs[c]=subs[c].filter(function(x){ return x!==cb; }); };
    },
    set:function(c,id,o){ ensure(c); var had=id in colls[c]; colls[c][id]=o; save(c); notify(c,[{type:had?'modified':'added',row:Object.assign({id:id},o)}]); return Promise.resolve(); },
    update:function(c,id,p){ ensure(c); colls[c][id]=Object.assign({},colls[c][id],p); save(c); notify(c,[{type:'modified',row:Object.assign({id:id},colls[c][id])}]); return Promise.resolve(); },
    remove:function(c,id){ ensure(c); delete colls[c][id]; save(c); notify(c,[{type:'removed',row:{id:id}}]); return Promise.resolve(); },
    newId:function(){ return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  };
}
function dbStore(db){
  return {
    mode:'db',
    watch:function(c,cb,onErr){
      return db.collection(c).onSnapshot(function(snap){
        var rows=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
        var changes=snap.docChanges().map(function(ch){ return {type:ch.type,row:Object.assign({id:ch.doc.id},ch.doc.data()||{})}; });
        cb(rows,changes);
      },function(e){ if(onErr) onErr(e); });
    },
    set:function(c,id,o){ return db.doc(c+'/'+id).set(o); },
    update:function(c,id,p){ return db.doc(c+'/'+id).update(p); },
    remove:function(c,id){ return db.doc(c+'/'+id).delete(); },
    newId:function(){ return db.collection('ids').doc().id; }
  };
}

function errText(e){

}

gs are deleted too.", "🗑: eliminar persona. Toca dos veces. También se pierden su plan de turnos y sus ajustes.", "🗑: kişiyi sil. İki kez dokun. Vardiya planı ve ayarları da silinir.", "🗑: obriši osobu. Dodirni dvaput. Pritom se brišu i njen plan smjena i postavke."], "„+ Person hinzufügen“: neue Person anlegen, bis zu 20, zum Beispiel die Oma.": ["“+ Add person”: create a new person, up to 20, for example Grandma.", "«+ Añadir persona»: crear una persona nueva, hasta 20, por ejemplo la abuela.", "“+ Kişi ekle”: yeni kişi oluştur, en fazla 20, örneğin büyükanne.", "„+ Dodaj osobu“: nova osoba, do 20, na primjer nana."], "Die Einträge liegen nur auf diesem Gerät.": ["The entries are only on this device.", "Las entradas solo están en este dispositivo.", "Kayıtlar yalnızca bu cihazda.", "Unosi su samo na ovom uređaju."], "Einstellungen ändern": ["Change settings", "Cambiar ajustes", "Ayarları değiştir", "Promijeni postavke"], "Nach oben": ["Move up", "Subir", "Yukarı", "Gore"], "Nach unten": ["Move down", "Bajar", "Aşağı", "Dolje"], "Farbe wählen": ["Choose colour", "Elegir color", "Renk seç", "Izaberi boju"], "Name": ["Name", "Nombre", "Ad", "Ime"], "Person löschen": ["Delete person", "Eliminar persona", "Kişiyi sil", "Obriši osobu"], "🙋 So werde ich erinnert": ["🙋 How I get reminded", "🙋 Así me avisan", "🙋 Bana nasıl hatırlatılır", "🙋 Kako me podsjeća"], "Gilt nur für": ["Applies only to", "Solo para", "Yalnızca şunun için geçerli:", "Važi samo za"], ". Die anderen stellen das auf ihrem Handy selbst ein.": [". The others set this on their own phones.", ". Los demás lo ajustan en su propio móvil.", ". Diğerleri bunu kendi telefonlarında ayarlar.", ". Ostali to podešavaju na svom mobitelu."], "Meine Termine": ["My appointments", "Mis citas", "Randevularım", "Moji termini"], "🔔 Benachrichtigung": ["🔔 Notification", "🔔 Notificación", "🔔 Bildirim", "🔔 Obavještenje"], "⏰ Wecker": ["⏰ Alarm", "⏰ Alarma", "⏰ Alarm", "⏰ Alarm"], "🔔 + ⏰ Beides": ["🔔 + ⏰ Both", "🔔 + ⏰ Ambos", "🔔 + ⏰ İkisi de", "🔔 + ⏰ Oboje"], "Nichts": ["Nothing", "Nada", "Hiçbiri", "Ništa"], "Termine für „Allgemein“": ["Appointments for “General”", "Citas para «General»", "“Genel” randevuları", "Termini za „Opće“"], "Auch bei Terminen der anderen benachrichtigen": ["Also notify for the others' appointments", "Avisar también de las citas de los demás", "Diğerlerinin randevularında da bildir", "Obavijesti i za termine ostalih"], "Erinnert wird nur bei Terminen, bei denen eine Erinnerung eingestellt ist. Der Haken „Bei mir als Wecker klingeln“ am Termin gilt immer nur für die Person, die ihn setzt.": ["Reminders only come for appointments that have a reminder set. The tick “Ring as alarm for me” on an appointment only applies to the person who sets it.", "Solo se avisa de las citas que tienen un recordatorio. La casilla «Sonar como alarma para mí» solo vale para quien la marca.", "Yalnızca hatırlatıcı ayarlanmış randevular için hatırlatılır. Randevudaki “Bende alarm olarak çalsın” işareti yalnızca onu koyan kişi için geçerlidir.", "Podsjeća se samo na termine kod kojih je podešen podsjetnik. Kvačica „Kod mene zvoni kao alarm“ važi samo za osobu koja je stavi."], "Die Erinnerungszeit stellst du direkt am Eintrag ein: bei jedem Termin unter „Erinnerung“ (auch eigene Zeit und „Bei mir als Wecker klingeln“), bei Geburtstagen im Adressbuch und bei den Tonnen. Hier stellst du die Wecker für Schichten ein.": ["You set the reminder time on the entry itself: for each appointment under “Reminder” (also custom time and “Ring as alarm for me”), for birthdays in the address book and for the bins. Here you set the alarms for shifts.", "La hora del recordatorio se ajusta en cada entrada: en cada cita en «Recordatorio» (también hora propia y «Sonar como alarma para mí»), en los cumpleaños de la agenda y en los contenedores. Aquí ajustas las alarmas de los turnos.", "Hatırlatma zamanını doğrudan kayıtta ayarlarsın: her randevuda “Hatırlatıcı” altında (özel saat ve “Bende alarm olarak çalsın” dahil), rehberdeki doğum günlerinde ve çöp kutularında. Burada vardiya alarmlarını ayarlarsın.", "Vrijeme podsjetnika podešavaš direktno kod unosa: kod svakog termina pod „Podsjetnik“ (i vlastito vrijeme i „Kod mene zvoni kao alarm“), kod rođendana u imeniku i kod kanti. Ovdje podešavaš alarme za smjene."], "Wecker für Schichten": ["Alarms for shifts", "Alarmas para turnos", "Vardiya alarmları", "Alarmi za smjene"], "Klingelt in der App auf dem Handy der jeweiligen Person (Menü → „Ich bin“). Bei geschlossener App kommt eine Benachrichtigung (oben einschalten). Mit 📱 stellst du die Zeit zusätzlich einmal im Handy-Wecker.": ["Rings in the app on that person's phone (Menu → “I am”). When the app is closed a notification comes (turn on above). With 📱 you also set the time once in the phone's alarm clock.", "Suena en la app en el móvil de cada persona (Menú → «Soy»). Con la app cerrada llega una notificación (actívala arriba). Con 📱 pones además la hora una vez en el despertador del móvil.", "İlgili kişinin telefonunda uygulamada çalar (Menü → “Ben”). Uygulama kapalıysa bildirim gelir (yukarıdan aç). 📱 ile saati ayrıca bir kez telefonun alarmına kurarsın.", "Zvoni u aplikaciji na mobitelu dotične osobe (Meni → „Ja sam“). Kad je aplikacija zatvorena, stiže obavještenje (uključi gore). Sa 📱 vrijeme dodatno jednom postaviš u alarm mobitela."], "Frühschicht": ["Early shift", "Turno de mañana", "Sabah vardiyası", "Prva smjena"], "aus": ["off", "desactivado", "kapalı", "isključeno"], "Spätschicht": ["Late shift", "Turno de tarde", "Akşam vardiyası", "Druga smjena"], "Nachtschicht": ["Night shift", "Turno de noche", "Gece vardiyası", "Noćna smjena"], "Tagdienst": ["Day shift", "Turno de día", "Gündüz mesaisi", "Dnevna smjena"], "🔔 Testklingeln": ["🔔 Test ring", "🔔 Probar sonido", "🔔 Deneme çalması", "🔔 Probno zvono"], "Wecker an": ["Alarm on", "Alarma activada", "Alarm açık", "Alarm uključen"], "Darstellung": ["Display", "Apariencia", "Görünüm", "Izgled"], "Hell": ["Light", " maño de las casillas:", "Takvim kutularının boyutu:", "Veličina kućica u kalendaru:"], "flach": ["flat", "bajo", "basık", "nisko"], "hoch": ["tall", "alto", "yüksek", "visoko"], "Größe der Knöpfe:": ["Button size:", "Tamaño de los botones:", "Düğme boyutu:", "Veličina dugmadi:"], "klein": ["small", "pequeño", "küçük", "malo"], "groß": ["large", "grande", "büyük", "veliko"], "Form, Größe und Kontur zurücksetzen": ["Reset shape, size and outline", "Restablecer forma, tamaño y contorno", "Şekil, boyut ve çerçeveyi sıfırla", "Vrati oblik, veličinu i obrub"], "Gilt nur für dieses Gerät. Beim Schieben siehst du die Änderung sofort.": ["Applies to this device only. You see the change right away while sliding.", "Solo para este dispositivo. Al deslizar ves el cambio al instante.", "Yalnızca bu cihaz için geçerli. Kaydırırken değişikliği hemen görürsün.", "Važi samo za ovaj uređaj. Dok pomjeraš, odmah vidiš promjenu."], "Schichten nach Art färben": ["Colour shifts by type", "Colorear turnos por tipo", "Vardiyaları türe göre renklendir", "Boji smjene po vrsti"], "Meine Früh-, Spät-, Nacht- und Tagdienst-Schichten bekommen eigene Farben statt meiner Personenfarbe": ["My early, late, night and day shifts get their own colours instead of my person colour", "Mis turnos de mañana, tarde, noche y día tienen colores propios en vez de mi color de persona", "Sabah, akşam, gece ve gündüz vardiyalarım kişi rengim yerine kendi renklerini alır", "Moje prva, druga, noćna i dnevna smjena dobijaju vlastite boje umjesto moje boje osobe"], "Datum und Uhrzeit auswählen": ["Choosing date and time", "Elegir fecha y hora", "Tarih ve saat seçimi", "Izbor datuma i vremena"], "Rad (scrollen)": ["Wheel (scroll)", "Rueda (desplazar)", "Tekerlek (kaydır)", "Točkić (skrolanje)"], "Liste (Auswahlfenster)": ["List (pop-up)", "Lista (ventana)", "Liste (seçim penceresi)", "Lista (prozor za izbor)"], "Gilt nur für dieses Gerät.": ["Applies to this device only.", "Solo para este dispositivo.", "Yalnızca bu cihaz için geçerli.", "Važi samo za ovaj uređaj."], "Tempo der Räder": ["Wheel speed", "Velocidad de las ruedas", "Tekerlek hızı", "Brzina točkića"], "Ruhig": ["Calm", "Tranquilo", "Sakin", "Mirno"], "Normal": ["Normal", "Normal", "Normal", "Normalno"], "Schnell": ["Fast", "Rápido", "Hızlı", "Brzo"], "Bei „Ruhig“ läuft das Rad bei gleicher Wischbewegung weniger weit.": ["With “Calm” the wheel turns less far for the same swipe.", "Con «Tranquilo» la rueda gira menos con el mismo gesto.", "“Sakin”de tekerlek aynı kaydırmada daha az döner.", "Kod „Mirno“ točkić se pri istom potezu manje okreće."], "Rahmendicke": ["Frame thickness", "Grosor del marco", "Çerçeve kalınlığı", "Debljina okvira"], "Kästchen-Größe": ["Box size", "Tamaño de casilla", "Kutu boyutu", "Veličina kućice"], "Knopf-Größe": ["Button size", "Tamaño de botón", "Düğme boyutu", "Veličina dugmeta"], "Für welchen Tab?": ["For which tab?", "¿Para qué pestaña?", "Hangi sekme için?", "Za koju karticu?"], "Alle Tabs": ["All tabs", "Todas las pestañas", "Tüm sekmeler", "Sve kartice"], "Müll": ["Waste", "Basura", "Çöp", "Smeće"], "Erst den Tab wählen, dann Art und Farbe. „Alle Tabs“ gilt überall, wo nichts Eigenes eingestellt ist (● = eigener Stil). Wird in deinem Konto gesichert.": ["First choose the tab, then style and colour. “All tabs” applies wherever nothing of its own is set (● = own style). Saved in your account.", "Primero elige la pestaña, luego estilo y color. «Todas las pestañas» vale donde no haya nada propio (● = estilo propio). Se guarda en tu cuenta.", "Önce sekmeyi, sonra stili ve rengi seç. “Tüm sekmeler” kendine ait ayar olmayan her yerde geçerlidir (● = kendi stili). Hesabına kaydedilir.", "Prvo izaberi karticu, pa stil i boju. „Sve kartice“ važi svuda gdje nije podešeno ništa posebno (● = vlastiti stil). Čuva se na tvom računu."], "Art auswählen": ["Choose style", "Elegir estilo", "Stil seç", "Izaberi stil"], "Beige matt": ["Matte beige", "Beige mate", "Mat bej", "Mat bež"], "Pastell": ["Pastel", "Pastel", "Pastel", "Pastelno"], "Natur": ["Nature", "Naturaleza", "Doğa", "Priroda"], "Ozean": ["Ocean", "Océano", "Okyanus", "Okean"], "Sonnenuntergang": ["Sunset", "Atardecer", "Gün batımı", "Zalazak sunca"], "Edel": ["Elegant", "Elegante", "Zarif", "Elegantno"], "Eigene Farben": ["Own colours", "Colores propios", "Kendi renklerin", "Vlastite boje"], "Eigenes Bild": ["Own picture", "Imagen propia", "Kendi resmin", "Vlastita slika"], "Tippe eine Art an, darunter erscheinen gleich ihre Farben.": ["Tap a style, its colours appear right below.", "Toca un estilo y sus colores aparecen debajo.", "Bir stile dokun, renkleri hemen altında görünür.", "Dodirni stil, ispod se odmah pojave njegove boje."], "Gilt für:": ["Applies to:", "Para:", "Geçerli olduğu yer:", "Važi za:"], "Oben": ["Top", "Arriba", "Üstte", "Gore"], "Links": ["Left", "Izquierda", "Solda", "Lijevo"], "Rechts": ["Right", "Derecha", "Sağda", "Desno"], "Immer offen": ["Always open", "Siempre abierta", "Hep açık", "Uvijek otvoreno"], "Einklappbar (Griff)": ["Collapsible (handle)", "Plegable (asa)", "Katlanabilir (tutamak)", "Sklopivo (ručka)"], "Bei „Einklappbar“ öffnest und schließt du die Leiste mit dem kleinen Griff am Rand. Gilt nur für dieses Gerät.": ["With “Collapsible” you open and close the bar with the small handle at the edge. Applies to this device only.", "Con «Plegable» abres y cierras la barra con la pequeña asa del borde. Solo para este dispositivo.", "“Katlanabilir”de çubuğu kenardaki küçük tutamakla açıp kapatırsın. Yalnızca bu cihaz için geçerli.", "Kod „Sklopivo“ traku otvaraš i zatvaraš malom ručkom na rubu. Važi samo za ovaj uređaj."], "Wo zeigen?": ["Where to show?", "¿Dónde mostrar?", "Nerede gösterilsin?", "Gdje prikazati?"], "Überall": ["Everywhere", "En todas partes", "Her yerde", "Svuda"], "Nur im Kalender": ["Only in the calendar", "Solo en el calendario", "Yalnızca takvimde", "Samo u kalendaru"], "Bei „Nur im Kalender“ kommst du aus den anderen Seiten mit „‹ Zurück zum Kalender“ oder dem ✕ zurück.": ["With “Only in the calendar” you get back from the other pages with “‹ Back to calendar” or the ✕.", "Con «Solo en el calendario» vuelves desde las otras páginas con «‹ Volver al calendario» o la ✕.", "“Yalnızca takvimde”de diğer sayfalardan “‹ Takvime dön” veya ✕ ile dönersin.", "Kod „Samo u kalendaru“ sa drugih stranica se vraćaš sa „‹ Nazad na kalendar“ ili ✕."], "Obere Leiste (Titel und Menü-Knopf)": ["Top bar (title and menu button)", "Barra superior (título y botón de menú)", "Üst çubuk (başlık ve menü düğmesi)", "Gornja traka (naslov i dugme menija)"], "Das Menü erreichst du dann nur im Kalender.": ["You can then reach the menu only in the calendar.", "Entonces el menú solo se abre en el calendario.", "O zaman menüye yalnızca takvimden ulaşırsın.", "Meni tada otvaraš samo u kalendaru."], "Tabs anzeigen": ["Show tabs", "Mostrar pestañas", "Sekmeleri göster", "Prikaži kartice"], "+ Eigener Tab": ["+ Own tab", "+ Pestaña propia", "+ Kendi sekmen", "+ Vlastita kartica"], "Noch keine Fahrpläne. Lege für jede Haltestelle einen Eintrag an, zum Beispiel den Schulbus mit beiden Haltestellen.": ["No timetables yet. Create an entry for each stop, for example the school bus with both stops.", "Aún no hay horarios. Crea una entrada para cada parada, por ejemplo el autobús escolar con ambas paradas.", "Henüz sefer saati yok. Her durak için bir kayıt oluştur, örneğin iki durağıyla okul servisi.", "Još nema redova vožnje. Za svaku stanicu napravi unos, npr. školski autobus sa obje stanice."], "+ Haltestelle hinzufügen": ["+ Add stop", "+ Añadir parada", "+ Durak ekle", "+ Dodaj stanicu"], "Freiwillig: Nur wer hier eingeschaltet ist, wird gezählt. Die Stunden kommen aus den Schicht-Uhrzeiten im Kalender.": ["Optional: only people switched on here are counted. The hours come from the shift times in the calendar.", "Opcional: solo se cuenta a quien esté activado aquí. Las horas salen de los horarios de turno del calendario.", "İsteğe bağlı: yalnızca burada açık olanlar sayılır. Saatler takvimdeki vardiya saatlerinden gelir.", "Neobavezno: broji se samo ko je ovdje uključen. Sati dolaze iz vremena smjena u kalendaru."], "Noch keine Fristen. TÜV, Ausweise, Verträge: Die App erinnert euch rechtzeitig, alle in der Familie bekommen die Meldung.": ["No deadlines yet. Car inspection, IDs, contracts: the app reminds you in time, everyone in the family gets the message.", "Aún no hay plazos. ITV, documentos, contratos: la app os avisa a tiempo y toda la familia recibe el aviso.", "Henüz süre yok. Araç muayenesi, kimlikler, sözleşmeler: uygulama zamanında hatırlatır, ailedeki herkes bildirimi alır.", "Još nema rokova. Tehnički pregled, isprave, ugovori: aplikacija vas podsjeti na vrijeme, svi u porodici dobiju poruku."], "+ Frist hinzufügen": ["+ Add deadline", "+ Añadir plazo", "+ Süre ekle", "+ Dodaj rok"], "So funktioniert’s": ["How it works", "Cómo funciona", "Nasıl çalışır", "Kako radi"], "📅 Kalender & Termine": ["📅 Calendar & appointments", "📅 Calendario y citas", "📅 Takvim ve randevular", "📅 Kalendar i termini"], "Oben zwischen": ["At the top switch between", "Arriba cambia entre", "Üstte şunlar arasında geçiş yap:", "Gore prebacuj između"], "und": ["and", "y", "ve", "i"], "wechseln. Tippe auf einen Tag, unten erscheinen alle Termine dieses Tages.": [". Tap a day, all appointments of that day appear below.", ". Toca un día y abajo aparecen todas sus citas.", ". Bir güne dokun, o günün tüm randevuları aşağıda görünür.", ". Dodirni dan, ispod se pojave svi termini tog dana."], "+ Termin": ["+ Appointment", "+ Cita", "+ Randevu", "+ Termin"], ": zuerst „Für wen?“ wählen, dann Titel oder eine Kachel (z. B. Hausarzt, Banktermin), Datum und Uhrzeit.": [": first choose “For whom?”, then title or a tile (e.g. GP, bank appointment), date and time.", ": primero elige «¿Para quién?», luego título o una ficha (p. ej. médico de cabecera, cita en el banco), fecha y hora.", ": önce “Kimin için?” seç, sonra başlık veya bir kutucuk (ör. aile hekimi, banka randevusu), tarih ve saat.", ": prvo izaberi „Za koga?“, pa naslov ili pločicu (npr. porodični ljekar, termin u banci), datum i vrijeme."], "Tipp: Sprich einen ganzen Satz ins Titelfeld (Mikrofon der Tastatur), z. B. „Freitag 15 Uhr Zahnarzt“, und tippe auf „✨ Satz auswerten“.": ["Tip: speak a whole sentence into the title field (keyboard microphone), e.g. “Friday 3 pm dentist”, and tap “✨ Read sentence”.", "Consejo: di una frase entera en el campo del título (micrófono del teclado), p. ej. «viernes 15 h dentista», y toca «✨ Analizar frase».", "İpucu: başlık alanına (klavye mikrofonu) bütün bir cümle söyle, ör. “Cuma saat 15 diş hekimi”, ve “✨ Cümleyi değerlendir”e dokun.", "Savjet: izgovori cijelu rečenicu u polje za naslov (mikrofon tastature), npr. „petak 15 sati zubar“, i dodirni „✨ Obradi rečenicu“."], "Bei": ["With", "En", "Şurada:", "Kod"], "Wiederholen": ["Repeat", "Repetir", "Tekrarla", "Ponavljanje"], "stellst du ein, ob sich ein Termin jede Woche, alle 2–8 Wochen usw. wiederholt.": ["you set whether an appointment repeats every week, every 2–8 weeks etc.", "ajustas si una cita se repite cada semana, cada 2–8 semanas, etc.", "bir randevunun her hafta, 2–8 haftada bir vb. tekrarlanıp tekrarlanmayacağını ayarlarsın.", "podešavaš da li se termin ponavlja svake sedmice, svakih 2–8 sedmica itd."], "✏️ Einen einzelnen Termin ändern": ["✏️ Change a single appointment", "✏️ Cambiar una sola cita", "✏️ Tek bir randevuyu değiştir", "✏️ Promijeni pojedinačni termin"], "Tag antippen, dann den Termin antippen.": ["Tap the day, then tap the appointment.", "Toca el día y luego la cita.", "Güne, sonra randevuya dokun.", "Dodirni dan, pa termin."], "Bei wiederkehrenden Terminen oben": ["For repeating appointments keep", "En citas que se repiten deja arriba", "Tekrarlanan randevularda üstte", "Kod ponavljajućih termina gore ostavi"], "„Nur dieser Tag“": ["“Only this day”", "«Solo este día»", "“Yalnızca bu gün”", "„Samo ovaj dan“"], "lassen: Uhrzeit, Datum oder Stunden ändern sich dann nur an diesem Tag, z. B. bei Vertretung.": ["selected: time, date or lessons then change only on that day, e.g. for a substitute.", "seleccionado: hora, fecha o clases cambian solo ese día, p. ej. por sustitución.", "seçili bırak: saat, tarih veya dersler yalnızca o gün değişir, ör. vekalette.", "izabrano: vrijeme, datum ili časovi se tada mijenjaju samo tog dana, npr. kod zamjene."], "„Ganze Serie“": ["“Whole series”", "«Toda la serie»", "“Tüm seri”", "„Cijela serija“"], "ändert alle Termine dieser Reihe.": ["changes all appointments of this series.", "cambia todas las citas de la serie.", "bu serideki tüm randevuları değiştirir.", "mijenja sve termine ove serije."], "🕒 Schichtplan": ["🕒 Shift plan", "🕒 Plan de turnos", "🕒 Vardiya planı", "🕒 Plan smjena"], "Im Termin-Fenster oben auf": ["In the appointment window tap at the top on", "En la ventana de cita toca arriba en", "Randevu penceresinde üstte şuna dokun:", "U prozoru termina gore dodirni"], "Schichtplan": ["Shift plan", "Plan de turnos", "Vardiya planı", "Plan smjena"], "Pro Zeile: Schichtart, Anzahl Tage, Uhrzeit. Mit „+ Zeile“ baust du deinen Rhythmus auf, auch „Frei“-Tage.": ["Per row: shift type, number of days, time. With “+ Row” you build your rhythm, including “Off” days.", "Por fila: tipo de turno, número de días, hora. Con «+ Fila» creas tu ritmo, también días «Libre».", "Her satırda: vardiya türü, gün sayısı, saat. “+ Satır” ile ritmini kurarsın, “Boş” günler dahil.", "Po redu: vrsta smjene, broj dana, vrijeme. Sa „+ Red“ praviš svoj ritam, i „Slobodne“ dane."], "Beim Speichern wiederholt sich der Ablauf automatisch.": ["When saved, the sequence repeats automatically.", "Al guardar, la secuencia se repite automáticamente.", "Kaydedince sıra otomatik olarak tekrarlanır.", "Pri čuvanju se redoslijed automatski ponavlja."], "Abweichung an einem Tag: Tag antippen → auf die Schicht tippen → F, S, N, TD oder Frei wählen und ggf. die Uhrzeit nur für diesen Tag ändern.": ["Change on one day: tap the day → tap the shift → choose F, S, N, TD or Off and if needed change the time for that day only.", "Cambio en un día: toca el día → toca el turno → elige F, S, N, TD o Libre y, si hace falta, cambia la hora solo para ese día.", "Bir gündeki değişiklik: güne dokun → vardiyaya dokun → F, S, N, TD veya Boş seç ve gerekirse saati yalnızca o gün için değiştir.", "Izmjena jednog dana: dodirni dan → dodirni smjenu → izaberi F, S, N, TD ili Slobodno i po potrebi promijeni vrijeme samo za taj dan."], "Urlaub als normalen Termin eintragen, er verdrängt die Schicht an diesen Tagen.": ["Enter holiday as a normal appointment, it replaces the shift on those days.", "Introduce las vacaciones como cita normal; sustituyen al turno esos días.", "İzni normal bir randevu olarak gir, o günlerde vardiyanın yerini alır.", "Godišnji upiši kao običan termin, on tih dana zamjenjuje smjenu."], "📷 Foto auswerten": ["📷 Read photo", "📷 Analizar foto", "📷 Fotoğrafı değerlendir", "📷 Obradi fotografiju"], "Im Termin- oder Schichtplan-Fenster oben rechts auf": ["In the appointment or shift plan window tap at the top right on", "En la ventana de cita o de turnos toca arriba a la derecha en", "Randevu veya vardiya planı penceresinde sağ üstte şuna dokun:", "U prozoru termina ili plana smjena gore desno dodirni"], "Foto": ["Photo", "Foto", "Fotoğraf", "Fotografija"], "Person wählen, Foto aufnehmen oder aus der Galerie nehmen.": ["Choose a person, take a photo or pick one from the gallery.", "Elige una persona, haz una foto o tómala de la galería.", "Kişi seç, fotoğraf çek veya galeriden seç.", "Izaberi osobu, snimi fotografiju ili je uzmi iz galerije."], "„Bitte warten“ abwarten (bis zu 1 Minute), dann die Liste prüfen, bei Bedarf „Bearbeiten“ und eintragen.": ["Wait for “Please wait” (up to 1 minute), then check the list, “Edit” if needed, and add.", "Espera a «Espera, por favor» (hasta 1 minuto), revisa la lista, «Editar» si hace falta, y añade.", "“Lütfen bekleyin”i bekl s phone. Each person sets this here for themselves.", "Elige primero en Menú → «Soy» quién usa este móvil. Cada persona lo ajusta aquí para sí misma.", "Lütfen önce Menü → “Ben” altında bu telefonu kimin kullandığını seç. Herkes bunu burada kendisi için ayarlar.", "Molim prvo pod Meni → „Ja sam“ izaberi ko koristi ovaj mobitel. Svaka osoba to ovdje podešava za sebe."], "Blockiert. Bitte in den Browser-Einstellungen für diese Seite Benachrichtigungen erlauben.": ["Blocked. Please allow notifications for this site in the browser settings.", "Bloqueado. Permite las notificaciones para esta página en los ajustes del navegador.", "Engellendi. Lütfen tarayıcı ayarlarında bu site için bildirimlere izin ver.", "Blokirano. Molim dozvoli obavještenja za ovu stranicu u postavkama preglednika."], "Bon erkannt. Bitte kurz prüfen und speichern.": ["Receipt recognised. Please check briefly and save.", "Tique reconocido. Revisa y guarda.", "Fiş tanındı. Lütfen kısaca kontrol et ve kaydet.", "Račun prepoznat. Molim kratko provjeri i sačuvaj."], "Bon wird ausgelesen …": ["Reading receipt …", "Leyendo el tique …", "Fiş okunuyor …", "Račun se čita …"], "Chat verlassen": ["Leave chat", "Salir del chat", "Sohbetten çık", "Napusti chat"], "Damit sucht der Stundenplan den passenden Bus aus.": ["The timetable uses this to pick the right bus.", "Con esto el horario elige el autobús adecuado.", "Ders programı bununla uygun otobüsü seçer.", "Time raspored bira odgovarajući autobus."], "Danke! Deine Rückmeldung ist angekommen.": ["Thank you! Your feedback has arrived.", "¡Gracias! Tus comentarios han llegado.", "Teşekkürler! Geri bildirimin ulaştı.", "Hvala! Tvoja povratna informacija je stigla."], "Das Auslesen geht nur in der angemeldeten App.": ["Reading only works in the signed-in app.", "La lectura solo funciona con la sesión iniciada.", "Okuma yalnızca giriş yapılmış uygulamada çalışır.", "Čitanje radi samo u prijavljenoj aplikaciji."], "Das Auslesen von Fotos geht nur in der angemeldeten App.": ["Reading photos only works in the signed-in app.", "La lectura de fotos solo funciona con la sesión iniciada.", "Fotoğraf okuma yalnızca giriş yapılmış uygulamada çalışır.", "Čitanje fotografija radi samo u prijavljenoj aplikaciji."], "Das Bild wurde abgelehnt. Mach ein neues, gut beleuchtetes Foto.": ["The picture was rejected. Take a new, well-lit photo.", "La imagen fue rechazada. Haz una foto nueva y bien iluminada.", "Resim reddedildi. Yeni, iyi aydınlatılmış bir fotoğraf çek.", "Slika je odbijena. Napravi novu, dobro osvijetljenu fotografiju."], "Das Foto ist nicht mehr da. Bitte nochmal aufnehmen.": ["The photo is gone. Please take it again.", "La foto ya no está. Hazla de nuevo.", "Fotoğraf artık yok. Lütfen tekrar çek.", "Fotografije više nema. Molim snimi ponovo."], "Das Foto konnte nicht ausgewertet werden.": ["The photo could not be read.", "No se pudo analizar la foto.", "Fotoğraf değerlendirilemedi.", "Fotografija nije mogla biti obrađena."], "Das Foto konnte nicht gelesen werden.": ["The photo could not be read.", "No se pudo leer la foto.", "Fotoğraf okunamadı.", "Fotografija nije mogla biti pročitana."], "Das Foto konnte nicht verarbeitet werden.": ["The photo could not be processed.", "No se pudo procesar la foto.", "Fotoğraf işlenemedi.", "Fotografija nije mogla biti obrađena."], "Das Foto wird ausgewertet.": ["The photo is being read.", "Se está analizando la foto.", "Fotoğraf değerlendiriliyor.", "Fotografija se obrađuje."], "Das PDF ist zu groß (höchstens 15 MB).": ["The PDF is too large (max. 15 MB).", "El PDF es demasiado grande (máx. 15 MB).", "PDF çok büyük (en fazla 15 MB).", "PDF je prevelik (najviše 15 MB)."], "Das Speichern hat nicht geklappt. Bitte versuch es nochmal.": ["Saving didn't work. Please try again.", "No se pudo guardar. Inténtalo de nuevo.", "Kaydetme başarısız oldu. Lütfen tekrar dene.", "Čuvanje nije uspjelo. Molim pokušaj ponovo."], "Das ist kein lesbares Bild.": ["This is not a readable picture.", "No es una imagen legible.", "Bu okunabilir bir resim değil.", "Ovo nije čitljiva slika."], "Das konnte ich nicht auswerten. Formuliere es etwas genauer oder trage den Termin unten ein.": ["I couldn't read that. Phrase it more precisely or enter the appointment below.", "No pude analizarlo. Exprésalo con más precisión o introduce la cita abajo.", "Bunu değerlendiremedim. Daha net yaz veya randevuyu aşağıya gir.", "To nisam mogao obraditi. Napiši preciznije ili upiši termin ispod."], "Das konnte ich nicht auswerten. Trage den Termin unten ein.": ["I couldn't read that. Enter the appointment below.", "No pude analizarlo. Introduce la cita abajo.", "Bunu değerlendiremedim. Randevuyu aşağıya gir.", "To nisam mogao obraditi. Upiši termin ispod."], "Das konnte ich nicht in Zeilen umwandeln. Versuch es genauer, zum Beispiel „5 Tage Früh, 2 Tage frei“.": ["I couldn't turn that into rows. Try more precisely, for example “5 days early, 2 days off”.", "No pude convertirlo en filas. Prueba con más precisión, por ejemplo «5 días mañana, 2 días libres».", "Bunu satırlara dönüştüremedim. Daha net dene, örneğin “5 gün sabah, 2 gün boş”.", "To nisam mogao pretvoriti u redove. Pokušaj preciznije, npr. „5 dana prva, 2 dana slobodno“."], "Dein Text wird ausgewertet.": ["Your text is being read.", "Se está analizando tu texto.", "Metnin değerlendiriliyor.", "Tvoj tekst se obrađuje."], "Dein Zugriff wurde beendet. Lade die Seite neu.": ["Your access has ended. Reload the page.", "Tu acceso ha terminado. Recarga la página.", "Erişimin sona erdi. Sayfayı yenile.", "Tvoj pristup je završen. Ponovo učitaj stranicu."], "Der Cloudflare-Helfer ist auf diesem Gerät noch nicht eingetragen (Menü, Benachrichtigungen).": ["The Cloudflare helper is not set up on this device yet (Menu, notifications).", "El asistente de Cloudflare aún no está configurado en este dispositivo (Menú, notificaciones).", "Cloudflare yardımcısı bu cihazda henüz ayarlanmadı (Menü, bildirimler).", "Cloudflare pomoćnik još nije postavljen na ovom uređaju (Meni, obavještenja)."], "Der Schlüssel fehlt noch.": ["The key is still missing.", "Aún falta la clave.", "Anahtar hâlâ eksik.", "Ključ još nedostaje."], "Der Speicher dieser Seite ist voll. Lösche alte Einträge.": ["This page's storage is full. Delete old entries.", "El almacenamiento de esta página está lleno. Borra entradas antiguas.", "Bu sayfanın depolama alanı dolu. Eski kayıtları sil.", "Memorija ove stranice je puna. Obriši stare unose."], "Die Adresse ist nicht erreichbar. Bitte prüfen.": ["The address cannot be reached. Please check.", "No se puede acceder a la dirección. Compruébala.", "Adrese ulaşılamıyor. Lütfen kontrol et.", "Adresa nije dostupna. Molim provjeri."], "Die App merkt sich die Zeile. Beim nächsten Foto wird sie automatisch gewählt.": ["The app remembers the row. It is chosen automatically for the next photo.", "La app recuerda la fila. Se elegirá automáticamente en la próxima foto.", "Uygulama satırı hatırlar. Bir sonraki fotoğrafta otomatik seçilir.", "Aplikacija pamti red. Kod sljedeće fotografije bira se automatski."], "Die Auswertung hat eine unlesbare Antwort geliefert. Bitte nochmal versuchen, am besten mit einem Ausschnitt nur deiner Linie.": ["The analysis returned an unreadable answer. Please try again, ideally with a crop of just your line.", "El análisis dio una respuesta ilegible. Inténtalo de nuevo, mejor con un recorte solo de tu línea.", "Değerlendirme okunamayan bir yanıt verdi. Lütfen tekrar dene, en iyisi yalnızca hattının kırpıntısıyla.", "Obrada je dala nečitljiv odgovor. Molim pokušaj ponovo, najbolje sa isječkom samo tvoje linije."], "Die Auswertung hat nicht geklappt. Versuch es nochmal.": ["The analysis didn't work. Try again.", "El análisis no funcionó. Inténtalo de nuevo.", "Değerlendirme başarısız oldu. Tekrar dene.", "Obrada nije uspjela. Pokušaj ponovo."], "Die Auswertung ist hier gerade nicht verfügbar.": ["Analysis is not available here right now.", "El análisis no está disponible aquí ahora.", "Değerlendirme şu anda burada kullanılamıyor.", "Obrada trenutno ovdje nije dostupna."], "Die Auswertung ist hier nicht erlaubt. Trage den Termin unten ein.": ["Analysis is not allowed here. Enter the appointment below.", "El análisis no está permitido aquí. Introduce la cita abajo.", "Değerlendirmeye burada izin verilmiyor. Randevuyu aşağıya gir.", "Obrada ovdje nije dozvoljena. Upiši termin ispod."], "Die Auswertung ist in Firebase nicht eingeschaltet (AI Logic).": ["Analysis is not switched on in Firebase (AI Logic).", "El análisis no está activado en Firebase (AI Logic).", "Değerlendirme Firebase'de açık değil (AI Logic).", "Obrada nije uključena u Firebaseu (AI Logic)."], "Die Foto-Auswertung ist in Firebase noch nicht eingeschaltet (AI Logic).": ["Photo analysis is not switched on in Firebase yet (AI Logic).", "El análisis de fotos aún no está activado en Firebase (AI Logic).", "Fotoğraf değerlendirme Firebase'de henüz açık değil (AI Logic).", "Obrada fotografija još nije uključena u Firebaseu (AI Logic)."], "Die Kamera ist in dieser App für die Seite gesperrt. Öffne die Seite im Browser (Chrome) und versuch es dort.": ["The camera is blocked for this page in this app. Open the page in the browser (Chrome) and try there.", "La cámara está bloqueada para esta página en esta app. Abre la página en el navegador (Chrome) y prueba allí.", "Kamera bu uygulamada bu sayfa için engelli. Sayfayı tarayıcıda (Chrome) aç ve orada dene.", "Kamera je u ovoj aplikaciji blokirana za stranicu. Otvori stranicu u pregledniku (Chrome) i pokušaj tamo."], "Die Kamera ist noch nicht bereit. Warte kurz, bis du das Bild siehst.": ["The camera is not ready yet. Wait until you see the picture.", "La cámara aún no está lista. Espera a ver la imagen.", "Kamera henüz hazır değil. Görüntüyü görene kadar bekle.", "Kamera još nije spremna. Sačekaj dok ne vidiš sliku."], "Die Pause wird nur bei Schichten über 6 Stunden abgezogen.": ["The break is only deducted for shifts over 6 hours.", "La pausa solo se descuenta en turnos de más de 6 horas.", "Mola yalnızca 6 saatten uzun vardiyalarda düşülür.", "Pauza se odbija samo kod smjena dužih od 6 sati."], "Die Person bekommt eine Benachrichtigung.": ["The person gets a notification.", "La persona recibe una notificación.", "Kişi bir bildirim alır.", "Osoba dobija obavještenje."], "Die Verbindung wird noch aufgebaut. Bitte gleich nochmal.": ["Still connecting. Please try again in a moment.", "Aún se está conectando. Inténtalo enseguida.", "Bağlantı hâlâ kuruluyor. Lütfen birazdan tekrar dene.", "Veza se još uspostavlja. Molim pokušaj odmah ponovo."], "Die Verbindung wurde unterbrochen. Lade die Seite neu.": ["The connection was interrupted. Reload the page.", "Se interrumpió la conexión. Recarga la página.", "Bağlantı kesildi. Sayfayı yenile.", "Veza je prekinuta. Ponovo učitaj stranicu."], "Die Zeile konnte nicht gelesen werden.": ["The row could not be read.", "No se pudo leer la fila.", "Satır okunamadı.", "Red nije mogao biti pročitan."], "Die Zuordnung wird gespeichert und beim nächsten Foto automatisch genutzt.": ["The mapping is saved and used automatically for the next photo.", "La asignación se guarda y se usa automáticamente en la próxima foto.", "Eşleştirme kaydedilir ve bir sonraki fotoğrafta otomatik kullanılır.", "Dodjela se čuva i automatski koristi kod sljedeće fotografije."], "Dieser Browser kann keine Benachrichtigungen empfangen.": ["This browser cannot receive notifications.", "Este navegador no puede recibir notificaciones.", "Bu tarayıcı bildirim alamaz.", "Ovaj preglednik ne može primati obavještenja."], "Du hast die Auswertung nicht erlaubt.": ["You did not allow the analysis.", "No has permitido el análisis.", "Değerlendirmeye izin vermedin.", "Nisi dozvolio obradu."], "Du kannst alles lesen, aber nichts ändern.": ["You can read everything but change nothing.", "Puedes leerlo todo, pero no cambiar nada.", "Her şeyi okuyabilirsin ama hiçbir şeyi değiştiremezsin.", "Možeš sve čitati, ali ništa mijenjati."], "Ecken abschrägen": ["Bevel corners", "Biselar esquinas", "Köşeleri pahla", "Zakosi uglove"], "Ecken abschrägen:": ["Bevel corners:", "Biselar esquinas:", "Köşeleri pahla:", "Zakosi uglove:"], "Eigene wichtige Nummern (z. B. Abschleppdienst, Hausarzt, Schlüsseldienst) legst du mit „+ Kontakt“ an und setzt den Haken „Wichtige Nummer“.": ["Add your own important numbers (e.g. towing, GP, locksmith) with “+ Contact” and tick “Important number”.", "Añade tus números importantes (p. ej. grúa, médico, cerrajero) con «+ Contacto» y marca «Número importante».", "Kendi önemli numaralarını (ör. çekici, aile hekimi, çilingir) “+ Kişi” ile ekle ve “Önemli numara”yı işaretle.", "Vlastite važne brojeve (npr. šlep služba, porodični ljekar, bravar) dodaješ sa „+ Kontakt“ i označiš „Važan broj“."], "Ein paar Kürzel kenne ich noch nicht. Bitte einmal zuordnen.": ["I don't know a few codes yet. Please assign them once.", "Aún no conozco algunas abreviaturas. Asígnalas una vez.", "Bazı kısaltmaları henüz bilmiyorum. Lütfen bir kez eşleştir.", "Neke skraćenice još ne znam. Molim jednom ih dodijeli."], "Eine E-Mail-Adresse sieht nicht richtig aus.": ["An email address doesn't look right.", "Una dirección de correo no parece correcta.", "Bir e-posta adresi doğru görünmüyor.", "Jedna e-mail adresa ne izgleda ispravno."], "Eine Stunde antippen: ändern oder löschen, nur für einen Tag (Ausfall, Vertretung) oder dauerhaft (z. B. Kurs abgewählt).": ["Tap a lesson: change or delete, for one day only (cancelled, substitute) or permanently (e.g. course dropped).", "Toca una clase: cambiar o borrar, solo un día (cancelada, sustitución) o para siempre (p. ej. curso abandonado).", "Bir derse dokun: değiştir veya sil, yalnızca bir gün için (iptal, vekalet) veya kalıcı olarak (ör. bırakılan ders).", "Dodirni čas: promijeni ili obriši, samo za jedan dan (otkazano, zamjena) ili trajno (npr. odjavljen kurs)."], "Eine Woche vor": ["One week ahead", "Una semana adelante", "Bir hafta ileri", "Sedmicu naprijed"], "Eine Woche zurück": ["One week back", "Una semana atrás", "Bir hafta geri", "Sedmicu nazad"], "Eine freie Notizseite für alle, z. B. WLAN, Rezepte, Kleidergrößen.": ["A free notes page for everyone, e.g. Wi-Fi, recipes, clothing sizes.", "Una página de notas libre para todos, p. ej. wifi, recetas, tallas.", "Herkes için serbest bir not sayfası, ör. Wi-Fi, tarifler, beden ölçüleri.", "Slobodna stranica za bilješke za sve, npr. WLAN, recepti, veličine odjeće."], "Einträge aus der Claude-Version übernommen.": ["Entries taken over from the Claude version.", "Entradas importadas de la versión de Claude.", "Kayıtlar Claude sürümünden aktarıldı.", "Unosi preuzeti iz Claude verzije."], "Einträge hinzugefügt.": ["Entries added.", "Entradas añadidas.", "Kayıtlar eklendi.", "Unosi dodani."], "Einzelne Tage anpassen": ["Adjust individual days", "Ajustar días sueltos", "Tek tek günleri ayarla", "Prilagodi pojedine dane"], "Einzelne Tage ausblenden": ["Hide individual days", "Ocultar días sueltos", "Tek tek günleri gizle", "Sakrij pojedine dane"], "Erinnern (Tage vorher)": ["Remind (days before)", "Recordar (días antes)", "Hatırlat (gün önce)", "Podsjeti (dana prije)"], "Erinnerungen erscheinen oben im Kalender unter „Heute dran denken“, sobald du die App öffnest. Echte Handy-Benachrichtigungen kommen erst, wenn die App auf dem eigenen Server läuft.": ["Reminders appear at the top of the calendar under “Remember today” as soon as you open the app. Real phone notifications only come once the app runs on its own server.", "Los recordatorios aparecen arriba en el calendario en «Recordar hoy» al abrir la app. Las notificaciones reales solo llegan cuando la app funciona en su propio servidor.", "Hatırlatıcılar uygulamayı açınca takvimin üstünde “Bugün unutma” altında görünür. Gerçek telefon bildirimleri ancak uygulama kendi sunucusunda çalışınca gelir.", "Podsjetnici se pojave gore u kalendaru pod „Danas ne zaboravi“ čim otvoriš aplikaciju. Prava obavještenja na mobitel dolaze tek kad aplikacija radi na vlastitom serveru."], "Fahrzeit bis zur Schule bzw. zum Ziel (Min.)": ["Travel time to school or destination (min)", "Tiempo de viaje al colegio o destino (min)", "Okula veya hedefe yolculuk süresi (dk)", "Vrijeme vožnje do škole ili cilja (min)"], "Falls „Foto aufnehmen“ nichts öffnet, nimm die Live-Kamera.": ["If “Take photo” doesn't open anything, use the live camera.", "Si «Hacer foto» no abre nada, usa la cámara en vivo.", "“Fotoğraf çek” hiçbir şey açmazsa canlı kamerayı kullan.", "Ako „Snimi fotografiju“ ništa ne otvori, koristi kameru uživo."], "Farbe für den neuen Zettel": ["Colour for the new note", "Color de la nota nueva", "Yeni notun rengi", "Boja za novu cedulju"], "Farben sind grau, verwaschen oder dunkel, obwohl „Hell“ eingestellt ist": ["Colours are grey, washed out or dark although “Light” is set", "Los colores se ven grises, apagados u oscuros aunque esté puesto «Claro»", "“Açık” ayarlı olmasına rağmen renkler gri, soluk veya koyu", "Boje su sive, isprane ili tamne iako je podešeno „Svijetlo“"], "Fehler.": ["Error.", "Error.", "Hata.", "Greška."], "Fehler:": ["Error:", "Error:", "Hata:", "Greška:"], "Fertig, löschen": ["Done, delete", "Hecho, borrar", "Bitti, sil", "Gotovo, obriši"], "Foto ansehen": ["View photo", "Ver foto", "Fotoğrafı gör", "Pogledaj fotografiju"], "Foto aufnehmen": ["Take photo", "Hacer foto", "Fotoğraf çek", "Snimi fotografiju"], "Foto einfügen": ["Paste photo", "Pegar foto", "Fotoğraf yapıştır", "Zalijepi fotografiju"], "Foto gespeichert.": ["Photo saved.", "Foto guardada.", "Fotoğraf kaydedildi.", "Fotografija sačuvana."], "Foto groß ansehen": ["View photo large", "Ver foto grande", "Fotoğrafı büyük gör", "Pogledaj veliku fotografiju"], "Foto hier einfügen": ["Paste photo here", "Pega la foto aquí", "Fotoğrafı buraya yapıştır", "Zalijepi fotografiju ovdje"], "Foto konnte nicht gespeichert werden.": ["Photo could not be saved.", "No se pudo guardar la foto.", "Fotoğraf kaydedilemedi.", "Fotografija nije sačuvana."], "Foto löschen": ["Delete photo", "Borrar foto", "Fotoğrafı sil", "Obriši fotografiju"], "Foto oder Text auswerten": ["Read photo or text", "Analizar foto o texto", "Fotoğrafı veya metni değerlendir", "Obradi fotografiju ili tekst"], "Foto vom Fahrplan": ["Photo of the timetable", "Foto del horario", "Sefer saatlerinin fotoğrafı", "Fotografija reda vožnje"], "Foto wird gespeichert …": ["Saving photo …", "Guardando foto …", "Fotoğraf kaydediliyor …", "Fotografija se čuva …"], "Fotografiere den Aushang an der Haltestelle oder wähle ein Fahrplan-PDF (z. B. von der Schul-Webseite). Bei einem PDF mit vielen Haltestellen vorher oben die Haltestelle eintragen. Ist oben eine Linie eingetragen, liest die App nur diese Linie aus. Danach wählst du, welche Richtung Hin- und welche Rückfahrt ist.": ["Photograph the notice at the stop or choose a timetable PDF (e.g. from the school website). For a PDF with many stops, enter the stop above first. If a line is entered above, the app reads only that line. Then choose which direction is outward and which is return.", "Fotografía el cartel de la parada o elige un PDF de horarios (p. ej. de la web del colegio). En un PDF con muchas paradas, indica antes la parada arriba. Si arriba hay una línea, la app solo lee esa línea. Luego eliges qué dirección es la ida y cuál la vuelta.", "Duraktaki ilanın fotoğrafını çek veya bir sefer PDF'i seç (ör. okulun web sitesinden). Çok duraklı bir PDF'te önce yukarıya durağı gir. Yukarıda bir hat girilmişse uygulama yalnızca o hattı okur. Sonra hangi yönün gidiş, hangisinin dönüş olduğunu seçersin.", "Fotografiši oglas na stanici ili izaberi PDF reda vožnje (npr. sa web stranice škole). Kod PDF-a sa mnogo stanica prvo gore upiši stanicu. Ako je gore upisana linija, aplikacija čita samo tu liniju. Zatim biraš koji smjer je polazak, a koji povratak."], "Fotografiere einen Schichtplan, einen Zettel oder einen Brief mit Terminen. Die App liest ihn aus. Du prüfst die Liste und trägst sie ein. Steht ein Name auf dem Foto, wird er zugeordnet, sonst gilt die Standard-Person.": ["Photograph a shift plan, a note or a letter with appointments. The app reads it. You check the list and add it. If a name is on the photo it is assigned, otherwise the default person applies.", "Fotografía un plan de turnos, una nota o una carta con citas. La app la lee. Revisas la lista y la añades. Si hay un nombre en la foto, se asigna; si no, se usa la persona predeterminada.", "Randevuların olduğu bir vardiya planının, notun veya mektubun fotoğrafını çek. Uygulama okur. Listeyi kontrol edip eklersin. Fotoğrafta bir isim varsa atanır, yoksa varsayılan kişi geçerlidir.", "Fotografiši plan smjena, cedulju ili pismo sa terminima. Aplikacija ga pročita. Ti provjeriš listu i upišeš je. Ako je na fotografiji ime, dodjeljuje se, inače važi standardna osoba."], "Fotos auslesen geht hier gerade nicht.": ["Reading photos doesn't work here right now.", "Ahora no se pueden leer fotos aquí.", "Şu anda burada fotoğraf okunamıyor.", "Čitanje fotografija trenutno ovdje ne radi."], "Fotos auswerten geht auf diesem Gerät gerade nicht. Nutze das Textfeld unten. Oder öffne die Seite im Browser (Chrome), dort geht es vielleicht.": ["Reading photos doesn't work on this device right now. Use the text field below. Or open the page in the browser (Chrome), it may work there.", "Ahora no se pueden analizar fotos en este dispositivo. Usa el campo de texto de abajo. O abre la página en el navegador (Chrome), quizá funcione allí.", "Bu cihazda şu anda fotoğraf değerlendirilemiyor. Aşağıdaki metin alanını kullan. Ya da sayfayı tarayıcıda (Chrome) aç, orada çalışabilir.", "Obrada fotografija trenutno ne radi na ovom uređaju. Koristi tekstualno polje ispod. Ili otvori stranicu u pregledniku (Chrome), tamo možda radi."], "Fotos kannst du hinzufügen, sobald der Eintrag gespeichert ist.": ["You can add photos once the entry is saved.", "Puedes añadir fotos en cuanto se guarde la entrada.", "Kayıt kaydedildikten sonra fotoğraf ekleyebilirsin.", "Fotografije možeš dodati čim se unos sačuva."], "Fällt aus": ["Cancelled", "Cancelado", "İptal", "Otkazano"], "Für das Auslesen braucht die App Internet.": ["The app needs internet for reading.", "La app necesita internet para leer.", "Okuma için uygulamanın internete ihtiyacı var.", "Za čitanje aplikaciji treba internet."], "Für die Auswertung braucht die App Internet.": ["The app needs internet for the analysis.", "La app necesita internet para el análisis.", "Değerlendirme için uygulamanın internete ihtiyacı var.", "Za obradu aplikaciji treba internet."], "Für mich und allgemein": ["For me and general", "Para mí y general", "Benim için ve genel", "Za mene i opće"], "Für „1 Stunde vorher“ brauchst du eine Startzeit.": ["For “1 hour before” you need a start time.", "Para «1 hora antes» necesitas una hora de inicio.", "“1 saat önce” için bir başlangıç saati gerekir.", "Za „1 sat prije“ treba ti vrijeme početka."], "Ganze Familie": ["Whole family", "Toda la familia", "Tüm aile", "Cijela porodica"], "Geburtstag (optional)": ["Birthday (optional)", "Cumpleaños (opcional)", "Doğum günü (isteğe bağlı)", "Rođendan (neobavezno)"], "Geburtstag entfernen": ["Remove birthday", "Quitar cumpleaños", "Doğum gününü kaldır", "Ukloni rođendan"], "Gefunden. Tippe bei jeder Richtung, ob sie Hin- oder Rückfahrt ist.": ["Found. For each direction, tap whether it is outward or return.", "Encontrado. Toca en cada dirección si es ida o vuelta.", "Bulundu. Her yön için gidiş mi dönüş mü olduğuna dokun.", "Pronađeno. Kod svakog smjera dodirni da li je polazak ili povratak."], "Gerade zu viele Anfragen oder Nutzungslimit erreicht. Versuch es später nochmal.": ["Too many requests right now or usage limit reached. Try again later.", "Demasiadas solicitudes o límite de uso alcanzado. Inténtalo más tarde.", "Şu anda çok fazla istek var veya kullanım sınırına ulaşıldı. Daha sonra tekrar dene.", "Trenutno previše zahtjeva ili je dostignut limit. Pokušaj kasnije."], "Gerade zu viele Anfragen, bitte später nochmal.": ["Too many requests right now, please try later.", "Demasiadas solicitudes, inténtalo más tarde.", "Şu anda çok fazla istek var, lütfen sonra tekrar dene.", "Trenutno previše zahtjeva, molim pokušaj kasnije."], "Gerade zu viele Anfragen. Versuch es später nochmal.": ["Too many requests right now. Try again later.", "Demasiadas solicitudes. Inténtalo más tarde.", "Şu anda çok fazla istek var. Daha sonra tekrar dene.", "Trenutno previše zahtjeva. Pokušaj kasnije."], "Gespeichert und gesperrt.": ["Saved and locked.", "Guardado y bloqueado.", "Kaydedildi ve kilitlendi.", "Sačuvano i zaključano."], "Gespeichert, aber bei Cloudflare fehlt noch das Secret FIREBASE_SA.": ["Saved, but the secret FIREBASE_SA is still missing at Cloudflare.", "Guardado, pero en Cloudflare aún falta el secreto FIREBASE_SA.", "Kaydedildi, ancak Cloudflare'de FIREBASE_SA gizli anahtarı hâlâ eksik.", "Sačuvano, ali kod Cloudflarea još nedostaje tajna FIREBASE_SA."], "Gespeichert, aber der Helfer antwortet noch nicht richtig. Ist der neue Code bei Cloudflare bereitgestellt?": ["Saved, but the helper doesn't answer correctly yet. Has the new code been deployed at Cloudflare?", "Guardado, pero el asistente aún no responde bien. ¿Se ha desplegado el nuevo código en Cloudflare?", "Kaydedildi, ancak yardımcı henüz doğru yanıt vermiyor. Yeni kod Cloudflare'de yayınlandı mı?", "Sačuvano, ali pomoćnik još ne odgovara ispravno. Je li novi kod postavljen kod Cloudflarea?"], "Gespeichert. Jetzt kannst du Fotos hinzufügen.": ["Saved. Now you can add photos.", "Guardado. Ahora puedes añadir fotos.", "Kaydedildi. Artık fotoğraf ekleyebilirsin.", "Sačuvano. Sada možeš dodati fotografije."], "Gezeigt sind die ersten 126 Tage.": ["The first 126 days are shown.", "Se muestran los primeros 126 días.", "İlk 126 gün gösteriliyor.", "Prikazano je prvih 126 dana."], "Giftnotruf (Mainz, auch für Hessen)": ["Poison control (Mainz, also for Hesse)", "Centro toxicológico (Maguncia, también para Hesse)", "Zehir danışma hattı (Mainz, Hessen için de)", "Hitna pomoć za trovanja (Mainz, i za Hessen)"], "Gilt dauerhaft für jede Woche, z. B. wenn ein Kurs abgewählt wurde.": ["Applies permanently to every week, e.g. when a course was dropped.", "Se aplica siempre a cada semana, p. ej. si se dejó un curso.", "Her hafta için kalıcıdır, ör. bir ders bırakıldığında.", "Važi trajno za svaku sedmicu, npr. kad je kurs odjavljen."], "Gilt für die ganze Familie.": ["Applies to the whole family.", "Se aplica a toda la familia.", "Tüm aile için geçerli.", "Važi za cijelu porodicu."], "Gilt für jede Woche.": ["Applies to every week.", "Se aplica a cada semana.", "Her hafta için geçerli.", "Važi za svaku sedmicu."], "Gilt nur für diesen Tag, z. B. bei Vertretung.": ["Applies to this day only, e.g. for a substitute.", "Solo para este día, p. ej. por sustitución.", "Yalnızca bu gün için geçerli, ör. vekalette.", "Važi samo za ovaj dan, npr. kod zamjene."], "Gilt nur für diesen einen Tag, z. B. Ausfall oder Vertretung.": ["Applies to this one day only, e.g. cancelled or substitute.", "Solo para este día, p. ej. cancelación o sustitución.", "Yalnızca bu tek gün için geçerli, ör. iptal veya vekalet.", "Važi samo za ovaj jedan dan, npr. otkazano ili zamjena."], "Handy-Einstellungen → Apps → Chrome → Berechtigungen → Kamera und Fotos/Medien erlauben.": ["Phone settings → Apps → Chrome → Permissions → allow camera and photos/media.", "Ajustes del móvil → Aplicaciones → Chrome → Permisos → permitir cámara y fotos/multimedia.", "Telefon ayarları → Uygulamalar → Chrome → İzinler → kamera ve fotoğraflar/medyaya izin ver.", "Postavke mobitela → Aplikacije → Chrome → Dozvole → dozvoli kameru i fotografije/medije."], "Hat heute Geburtstag": ["Has a birthday today", "Cumple años hoy", "Bugün doğum günü", "Danas ima rođendan"], "Hat noch kein Handy": ["No phone yet", "Aún no tiene móvil", "Henüz telefonu yok", "Još nema mobitel"], "Hier lange tippen und „Einfügen“ wählen": ["Long-press here and choose “Paste”", "Mantén pulsado aquí y elige «Pegar»", "Buraya uzun dokun ve “Yapıştır”ı seç", "Ovdje dugo pritisni i izaberi „Zalijepi“"], "Hier schreiben … wird automatisch gespeichert.": ["Write here … saved automatically.", "Escribe aquí … se guarda automáticamente.", "Buraya yaz … otomatik kaydedilir.", "Piši ovdje … čuva se automatski."], "Hinfahrt: Abfahrt hier": ["Outward: departure here", "Ida: salida aquí", "Gidiş: buradan kalkış", "Polazak: odlazak odavde"], "Hinweis: Das ist eine Sichtsperre in der App, kein Tresor.": ["Note: this is a visibility lock in the app, not a safe.", "Nota: es un bloqueo de vista en la app, no una caja fuerte.", "Not: bu uygulamada bir görünürlük kilidi, kasa değil.", "Napomena: ovo je zaključavanje prikaza u aplikaciji, nije sef."], "Ich habe auf dem Foto keine Termine oder Schichten erkannt. Versuch ein schärferes, gerade fotografiertes Bild.": ["I found no appointments or shifts in the photo. Try a sharper, straight photo.", "No he reconocido citas ni turnos en la foto. Prueba con una foto más nítida y recta.", "Fotoğrafta randevu veya vardiya bulamadım. Daha net, düz çekilmiş bir fotoğraf dene.", "Na fotografiji nisam prepoznao termine ni smjene. Pokušaj oštriju, ravno snimljenu sliku."], "Ich konnte das Foto nicht eindeutig lesen. Halte die Kamera ruhig und näher ran.": ["I couldn't read the photo clearly. Hold the camera steady and closer.", "No pude leer bien la foto. Sujeta la cámara quieta y más cerca.", "Fotoğrafı net okuyamadım. Kamerayı sabit ve daha yakın tut.", "Nisam mogao jasno pročitati fotografiju. Drži kameru mirno i bliže."], "Ich konnte keinen Gesamtbetrag erkennen. Versuch ein schärferes Foto oder trag den Betrag selbst ein.": ["I couldn't find a total. Try a sharper photo or enter the amount yourself.", "No reconocí el importe total. Prueba con una foto más nítida o introduce el importe tú.", "Toplam tutarı bulamadım. Daha net bir fotoğraf dene veya tutarı kendin gir.", "Nisam prepoznao ukupan iznos. Pokušaj oštriju fotografiju ili sam upiši iznos."], "Ich lese … bei Fotos kann das bis zu einer Minute dauern.": ["Reading … with photos this can take up to a minute.", "Leyendo … con fotos puede tardar hasta un minuto.", "Okuyorum … fotoğraflarda bu bir dakikaya kadar sürebilir.", "Čitam … kod fotografija to može trajati do minute."], "Im Cloudflare-Helfer fehlt noch der RMV-Schlüssel.": ["The RMV key is still missing in the Cloudflare helper.", "En el asistente de Cloudflare aún falta la clave de RMV.", "Cloudflare yardımcısında RMV anahtarı hâlâ eksik.", "U Cloudflare pomoćniku još nedostaje RMV ključ."], "Im Einkauf zeigen": ["Show in shopping", "Mostrar en compras", "Alışverişte göster", "Prikaži u kupovini"], "Im Kalender zeigen": ["Show in calendar", "Mostrar en el calendario", "Takvimde göster", "Prikaži u kalendaru"], "Im Monat sichtbar für": ["Visible in the month for", "Visible en el mes para", "Ayda görünür:", "Vidljivo u mjesecu za"], "In der Zwischenablage war kein Bild. Kopiere zuerst ein Foto.": ["There was no picture in the clipboard. Copy a photo first.", "No había ninguna imagen en el portapapeles. Copia primero una foto.", "Panoda resim yoktu. Önce bir fotoğraf kopyala.", "U međuspremniku nije bilo slike. Prvo kopiraj fotografiju."], "In dieser App: Menü → Darstellung „Hell“ und Farbstil neu antippen, dann die Seite neu laden.": ["In this app: Menu → Display “Light” and tap the colour style again, then reload the page.", "En esta app: Menú → Apariencia «Claro» y vuelve a tocar el estilo de color, luego recarga la página.", "Bu uygulamada: Menü → Görünüm “Açık” ve renk stiline yeniden dokun, sonra sayfayı yenile.", "U ovoj aplikaciji: Meni → Izgled „Svijetlo“ i ponovo dodirni stil boja, pa ponovo učitaj stranicu."], "In dieser Zeile stehen keine Schichten.": ["There are no shifts in this row.", "No hay turnos en esta fila.", "Bu satırda vardiya yok.", "U ovom redu nema smjena."], "Ja, löschen": ["Yes, delete", "Sí, borrar", "Evet, sil", "Da, obriši"], "Jahr weglassen geht auch (--). Dann wird kein Alter angezeigt.": ["You can also leave out the year (--). Then no age is shown.", "También puedes omitir el año (--). Así no se muestra la edad.", "Yılı boş bırakabilirsin (--). O zaman yaş gösterilmez.", "Može i bez godine (--). Tada se ne prikazuje starost."], "Jede Woche": ["Every week", "Cada semana", "Her hafta", "Svake sedmice"], "Jeden Tag": ["Every day", "Cada día", "Her gün", "Svaki dan"], "Jedes Jahr": ["Every year", "Cada año", "Her yıl", "Svake godine"], "Kamera wird gestartet …": ["Starting camera …", "Iniciando cámara …", "Kamera başlatılıyor …", "Kamera se pokreće …"], "Kein Artikel erkannt. Sag oder tippe, was auf die Liste soll.": ["No item recognised. Say or type what should go on the list.", "No se reconoció ningún artículo. Di o escribe qué va en la lista.", "Ürün tanınmadı. Listeye ne ekleneceğini söyle veya yaz.", "Artikal nije prepoznat. Reci ili upiši šta ide na listu."], "Kein Tag ausgewählt.": ["No day selected.", "Ningún día seleccionado.", "Gün seçilmedi.", "Nije izabran dan."], "Keine Erinnerung": ["No reminder", "Sin recordatorio", "Hatırlatıcı yok", "Bez podsjetnika"], "Keine Schichten in diesem Monat": ["No shifts this month", "No hay turnos este mes", "Bu ay vardiya yok", "Nema smjena ovog mjeseca"], "Keine Schultermine in den nächsten Wochen. Klassenarbeiten, Elternabende oder Ausflüge trägst du mit „+ Schultermin“ ein.": ["No school events in the coming weeks. Add tests, parents' evenings or trips with “+ School event”.", "No hay citas escolares en las próximas semanas. Añade exámenes, reuniones de padres o excursiones con «+ Cita escolar».", "Önümüzdeki haftalarda okul etkinliği yok. Sınavları, veli toplantılarını veya gezileri “+ Okul etkinliği” ile ekle.", "Nema školskih termina narednih sedmica. Kontrolne, roditeljske sastanke ili izlete upisuješ sa „+ Školski termin“."], "Keine Verbindung zum Helfer.": ["No connection to the helper  "Birden çok saati virgülle ayır.", "Više vremena odvoji zarezom."], "Meist färbt der Browser die Seite selbst um. Bitte nacheinander prüfen:": ["Usually the browser recolours the page itself. Please check one after another:", "Normalmente el navegador cambia los colores de la página. Comprueba uno tras otro:", "Genellikle tarayıcı sayfayı kendisi yeniden renklendirir. Lütfen sırayla kontrol et:", "Obično preglednik sam mijenja boje stranice. Molim provjeri redom:"], "Melde dich mit deinem Google-Konto an. Nur eure Familie hat Zugang.": ["Sign in with your Google account. Only your family has access.", "Inicia sesión con tu cuenta de Google. Solo tu familia tiene acceso.", "Google hesabınla giriş yap. Yalnızca ailenin erişimi var.", "Prijavi se svojim Google računom. Pristup ima samo vaša porodica."], "Menü (drei Striche) → Einstellungen → „Design / Dunkelmodus“ → aus. Dort auch „Webseiten im Dunkelmodus anzeigen“ ausschalten.": ["Menu (three lines) → Settings → “Theme / dark mode” → off. Also turn off “Show websites in dark mode” there.", "Menú (tres rayas) → Ajustes → «Tema / modo oscuro» → desactivar. Desactiva también «Mostrar webs en modo oscuro».", "Menü (üç çizgi) → Ayarlar → “Tema / karanlık mod” → kapalı. Orada “Web sitelerini karanlık modda göster”i de kapat.", "Meni (tri crte) → Postavke → „Tema / tamni način“ → isključi. Tamo isključi i „Prikaži web stranice u tamnom načinu“."], "Min. bei Schichten über 6 Stunden.": ["min for shifts over 6 hours.", "min en turnos de más de 6 horas.", "dk, 6 saatten uzun vardiyalarda.", "min kod smjena dužih od 6 sati."], "Mit deinem Zugang kannst du hier nichts ändern.": ["With your access you can't change anything here.", "Con tu acceso no puedes cambiar nada aquí.", "Erişiminle burada hiçbir şeyi değiştiremezsin.", "Sa svojim pristupom ovdje ne možeš ništa mijenjati."], "Mit dem Finger einkreisen oder markieren.": ["Circle or mark with your finger.", "Rodea o marca con el dedo.", "Parmağınla daire içine al veya işaretle.", "Zaokruži ili označi prstom."], "Nach Geschäft": ["By shop", "Por tienda", "Mağazaya göre", "Po trgovini"], "Nachricht löschen": ["Delete message", "Borrar mensaje", "Mesajı sil", "Obriši poruku"], "Nachricht …": ["Message …", "Mensaje …", "Mesaj …", "Poruka …"], "Nachricht, Wecker oder beides gilt nur für dich. Die anderen werden so erinnert, wie sie es im Menü eingestellt haben.": ["Message, alarm or both only applies to you. The others are reminded as they set it in the menu.", "Mensaje, alarma o ambos solo se aplica a ti. Los demás reciben el aviso según lo que ajustaron en el menú.", "Mesaj, alarm veya ikisi yalnızca senin için geçerli. Diğerlerine menüde ayarladıkları gibi hatırlatılır.", "Poruka, alarm ili oboje važi samo za tebe. Ostali se podsjećaju kako su podesili u meniju."], "Name des Tabs": ["Tab name", "Nombre de la pestaña", "Sekme adı", "Naziv kartice"], "Neue Version": ["New version", "Nueva versión", "Yeni sürüm", "Nova verzija"], "Neuer Eintrag … (auch per Mikrofon)": ["New entry … (also by microphone)", "Nueva entrada … (también por micrófono)", "Yeni kayıt … (mikrofonla da)", "Novi unos … (i mikrofonom)"], "Neuer Kontakt": ["New contact", "Nuevo contacto", "Yeni kişi", "Novi kontakt"], "Neues Thema, z. B. Urlaub, Garten …": ["New topic, e.g. holiday, garden …", "Tema nuevo, p. ej. vacaciones, jardín …", "Yeni konu, ör. tatil, bahçe …", "Nova tema, npr. godišnji, bašta …"], "Nichts ausgewählt.": ["Nothing selected.", "Nada seleccionado.", "Hiçbir şey seçilmedi.", "Ništa nije izabrano."], "Niemand hat den Schicht-Wecker eingeschaltet. Das geht unter Menü → Familie und Weitere (⏰).": ["Nobody has turned on the shift alarm. You can do that under Menu → Family and others (⏰).", "Nadie ha activado la alarma de turno. Se hace en Menú → Familia y otros (⏰).", "Kimse vardiya alarmını açmadı. Bunu Menü → Aile ve diğerleri (⏰) altında yapabilirsin.", "Niko nije uključio alarm za smjenu. To ide pod Meni → Porodica i ostali (⏰)."], "Noch keine Nachrichten": ["No messages yet", "Aún no hay mensajes", "Henüz mesaj yok", "Još nema poruka"], "Noch keine Nachrichten.": ["No messages yet.", "Aún no hay mensajes.", "Henüz mesaj yok.", "Još nema poruka."], "Noch keine Nachrichten. Schreib die erste!": ["No messages yet. Write the first one!", "Aún no hay mensajes. ¡Escribe el primero!", "Henüz mesaj yok. İlkini sen yaz!", "Još nema poruka. Napiši prvu!"], "Nur diese Personen sehen den Zettel. Du selbst siehst ihn immer.": ["Only these people see the note. You always see it yourself.", "Solo estas personas ven la nota. Tú siempre la ves.", "Notu yalnızca bu kişiler görür. Sen her zaman görürsün.", "Cedulju vide samo ove osobe. Ti je uvijek vidiš."], "Nur dieser eine Termin wird verschoben. Der Rhythmus läuft danach normal weiter.": ["Only this one date is moved. The rhythm then continues as normal.", "Solo se mueve esta fecha. Después el ritmo sigue normal.", "Yalnızca bu tarih taşınır. Ritim sonra normal devam eder.", "Pomjera se samo ovaj termin. Ritam se zatim normalno nastavlja."], "Ohne Erinnerung steht der Termin nur im Kalender.": ["Without a reminder the appointment is only in the calendar.", "Sin recordatorio la cita solo aparece en el calendario.", "Hatırlatıcı olmadan randevu yalnızca takvimde durur.", "Bez podsjetnika termin stoji samo u kalendaru."], "Ohne deine Erlaubnis geht es nicht.": ["It doesn't work without your permission.", "No funciona sin tu permiso.", "İznin olmadan olmaz.", "Bez tvoje dozvole ne ide."], "Ohne Überschrift": ["No heading", "Sin título", "Başlıksız", "Bez naslova"], "Pause pro Schicht (Min.)": ["Break per shift (min)", "Pausa por turno (min)", "Vardiya başına mola (dk)", "Pauza po smjeni (min)"], "Plan löschen": ["Delete plan", "Borrar plan", "Planı sil", "Obriši plan"], "Prüfe …": ["Checking …", "Comprobando …", "Kontrol ediliyor …", "Provjeravam …"], "Punkte übernommen.": ["Items taken over.", "Puntos importados.", "Maddeler aktarıldı.", "Stavke preuzete."], "RMV ist gerade nicht erreichbar.": ["RMV is not reachable right now.", "RMV no está disponible ahora.", "RMV şu anda ulaşılamıyor.", "RMV trenutno nije dostupan."], "RMV lehnt den Schlüssel ab.": ["RMV rejects the key.", "RMV rechaza la clave.", "RMV anahtarı reddediyor.", "RMV odbija ključ."], "Rhythmus": ["Rhythm", "Ritmo", "Sıklık", "Ritam"], "Rückfahrt: Ankunft hier": ["Return: arrival here", "Vuelta: llegada aquí", "Dönüş: buraya varış", "Povratak: dolazak ovdje"], "S = nur an Schultagen": ["S = school days only", "S = solo días lectivos", "S = yalnızca okul günleri", "S = samo školskim danima"], "Sammelt alle Termine einer Art, z. B. alle Arzttermine.": ["Collects all appointments of one type, e.g. all doctor's appointments.", "Reúne todas las citas de un tipo, p. ej. todas las del médico.", "Bir türdeki tüm randevuları toplar, ör. tüm doktor randevuları.", "Skuplja sve termine jedne vrste, npr. sve ljekarske termine."], "Schicht an diesem Tag": ["Shift on this day", "Turno este día", "Bu günkü vardiya", "Smjena ovog dana"], "Schicht(en) ohne Uhrzeit nicht mitgezählt": ["shift(s) without time not counted", "turno(s) sin hora no contados", "saatsiz vardiya(lar) sayılmadı", "smjena bez vremena nije uračunata"], "Schlüssel hier einfügen": ["Paste key here", "Pega la clave aquí", "Anahtarı buraya yapıştır", "Zalijepi ključ ovdje"], "Schlüsseldatei wählen": ["Choose key file", "Elegir archivo de clave", "Anahtar dosyasını seç", "Izaberi datoteku ključa"], "Schnelle Chat-Meldungen (Cloudflare):": ["Fast chat notifications (Cloudflare):", "Avisos rápidos de chat (Cloudflare):", "Hızlı sohbet bildirimleri (Cloudflare):", "Brza obavještenja chata (Cloudflare):"], "Schreib oder sprich zuerst einen Satz.": ["Write or speak a sentence first.", "Escribe o di primero una frase.", "Önce bir cümle yaz veya söyle.", "Prvo napiši ili izgovori rečenicu."], "Schreib oder sprich zuerst etwas.": ["Write or speak something first.", "Escribe o di algo primero.", "Önce bir şey yaz veya söyle.", "Prvo nešto napiši ili izgovori."], "Sichtbar für": ["Visible to", "Visible para", "Görebilenler:", "Vidljivo za"], "So klingt der Wecker.": ["This is how the alarm sounds.", "Así suena la alarma.", "Alarm böyle çalar.", "Ovako zvuči alarm."], "Soll der Termin wirklich gelöscht werden?": ["Really delete the appointment?", "¿Seguro que quieres borrar la cita?", "Randevu gerçekten silinsin mi?", "Zaista obrisati termin?"], "Soll pro Monat (Std., optional)": ["Target per month (hrs, optional)", "Objetivo al mes (h, opcional)", "Aylık hedef (saat, isteğe bağlı)", "Planirano mjesečno (sati, neobavezno)"], "Speichern hat nicht geklappt.": ["Saving didn't work.", "No se pudo guardar.", "Kaydetme başarısız oldu.", "Čuvanje nije uspjelo."], "Speichern und einschalten": ["Save and turn on", "Guardar y activar", "Kaydet ve aç", "Sačuvaj i uključi"], "Speichern und prüfen": ["Save and check", "Guardar y comprobar", "Kaydet ve kontrol et", "Sačuvaj i provjeri"], "Speichern und sperren": ["Save and lock", "Guardar y bloquear", "Kaydet ve kilitle", "Sačuvaj i zaključaj"], "Speichern, Ablauf wiederholt sich ab hier": ["Save, sequence repeats from here", "Guardar, la secuencia se repite desde aquí", "Kaydet, sıra buradan itibaren tekrarlanır", "Sačuvaj, redoslijed se ponavlja odavde"], "Steht für alle immer in der Monatsübersicht, z. B. Familienurlaub.": ["Always shown to everyone in the month view, e.g. family holiday.", "Siempre visible para todos en la vista mensual, p. ej. vacaciones familiares.", "Aylık görünümde herkese her zaman görünür, ör. aile tatili.", "Uvijek stoji svima u mjesečnom pregledu, npr. porodični godišnji."], "Steht in der Monatsübersicht nur, wenn die Person oben angetippt ist. Beim Antippen des Tages sieht man ihn immer.": ["Shown in the month view only when the person is tapped above. Tapping the day always shows it.", "Aparece en la vista mensual solo si la persona está seleccionada arriba. Al tocar el día siempre se ve.", "Aylık görünümde yalnızca kişi yukarıda seçiliyse görünür. Güne dokununca her zaman görünür.", "U mjesečnom pregledu stoji samo kad je osoba gore dodirnuta. Kad dodirneš dan, uvijek se vidi."], "Stimmt etwas nicht, tippe beim Tag auf „Bearbeiten“. Eingetragen wird jede Woche ein „Schule“-Termin pro Tag mit allen Stunden darin. Später änderst du die Stunden, wenn du den Termin im Kalender antippst.": ["If something is wrong, tap “Edit” on the day. Each week one “School” appointment per day with all lessons is added. Later you change the lessons by tapping the appointment in the calendar.", "Si algo no cuadra, toca «Editar» en el día. Cada semana se añade una cita de «Colegio» por día con todas las clases. Después cambias las clases tocando la cita en el calendario.", "Bir şey yanlışsa günde “Düzenle”ye dokun. Her hafta gün başına tüm dersleri içeren bir “Okul” randevusu eklenir. Dersleri sonra takvimde randevuya dokunarak değiştirirsin.", "Ako nešto nije u redu, kod dana dodirni „Uredi“. Svake sedmice upisuje se jedan termin „Škola“ po danu sa svim časovima. Časove kasnije mijenjaš kad dodirneš termin u kalendaru."], "Stunde wirklich für jede Woche löschen?": ["Really delete the lesson for every week?", "¿Borrar la clase de verdad para todas las semanas?", "Ders gerçekten her hafta için silinsin mi?", "Zaista obrisati čas za svaku sedmicu?"], "Stundenplan erkannt. Bitte kurz prüfen.": ["Timetable recognised. Please check briefly.", "Horario reconocido. Revísalo.", "Ders programı tanındı. Lütfen kısaca kontrol et.", "Raspored prepoznat. Molim kratko provjeri."], "Such dir drei Farben aus. Das Feld oben ändert sich sofort mit. Tipp danach darauf, damit die Farben übernommen werden.": ["Pick three colours. The field above changes right away. Then tap it to apply the colours.", "Elige tres colores. El campo de arriba cambia al momento. Luego tócalo para aplicar los colores.", "Üç renk seç. Yukarıdaki alan hemen değişir. Renklerin uygulanması için sonra ona dokun.", "Izaberi tri boje. Polje gore se odmah mijenja.
